name: Starter Semana 1 — feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reproducible setup
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify (test + build + reporte)
        run: npm run verify

      - name: Upload academic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starter-week-01-evidence
          if-no-files-found: warn
          path: |
            reports/